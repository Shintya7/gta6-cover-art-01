<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — turn your photo into poster art</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23120e1e'/%3E%3Crect x='5' y='5' width='10' height='22' fill='%23ff9a3d'/%3E%3Crect x='17' y='5' width='10' height='22' fill='%23ff2e88'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header class="brand">
      <h1>Vice Cover Studio</h1>
      <p>Your photo, your words — a poster in four steps. Nothing leaves your machine.</p>
    </header>

    <section class="step" aria-label="Step 1: layout">
      <h2><span class="step-no">1</span> Layout</h2>
      <div class="layout-picker" role="group" aria-label="Poster layout">
        <button type="button" data-layout="poster" class="active">
          <span class="mini mini-poster" aria-hidden="true"><i></i><i></i><i></i></span>Poster
        </button>
        <button type="button" data-layout="triptych">
          <span class="mini mini-triptych" aria-hidden="true"><i></i><i></i><i></i></span>Triptych
        </button>
        <button type="button" data-layout="single">
          <span class="mini mini-single" aria-hidden="true"><i></i></span>Single
        </button>
      </div>
    </section>

    <section class="step" aria-label="Step 2: photos">
      <h2><span class="step-no">2</span> Photos</h2>
      <div class="panel-tabs" id="panelTabs" role="group" aria-label="Choose a panel to edit">
        <button type="button" data-panel="0" class="active">Panel 1</button>
        <button type="button" data-panel="1">Panel 2</button>
        <button type="button" data-panel="2">Panel 3</button>
      </div>
      <label class="file-label">Photo for this panel
        <input id="photo" type="file" accept="image/*">
      </label>
      <div class="samples" aria-label="Try a sample photo">
        <span>Or try a sample:</span>
        <button type="button" data-sample="boulevard" class="sample-thumb" aria-label="Sample: sunset boulevard">
          <img src="./samples/boulevard.jpg" alt="">
        </button>
        <button type="button" data-sample="pier" class="sample-thumb" aria-label="Sample: pier fishing">
          <img src="./samples/pier.jpg" alt="">
        </button>
      </div>
      <button id="fillAll" type="button" class="ghost">Fill all panels with this photo</button>
      <label class="slider-label">Zoom
        <input id="zoom" type="range" min="100" max="300" value="100" step="1">
        <span id="zoomValue">100%</span>
      </label>
      <label class="select-label">Colour grade
        <select id="grade">
          <option value="sunset" selected>Sunset — warm pink and orange</option>
          <option value="neon">Neon — magenta and cyan nights</option>
          <option value="golden">Golden — honey hour</option>
          <option value="noir">Noir — high-contrast black and white</option>
        </select>
      </label>
      <p class="hint">Click a panel in the preview to pick it. Drag its photo to move it, scroll to zoom.</p>
    </section>

    <section class="step" aria-label="Step 3: caption">
      <h2><span class="step-no">3</span> Caption</h2>
      <label>Caption
        <input id="caption" type="text" maxlength="40" value="Sunset Heist">
      </label>
      <label>Subcaption
        <input id="subcaption" type="text" maxlength="48" value="Palms · Sunset · Neon">
      </label>
      <div class="segmented" role="group" aria-label="Caption position">
        <button type="button" data-position="bottom" class="active">Bottom</button>
        <button type="button" data-position="top">Top</button>
      </div>
      <div class="swatches" role="group" aria-label="Caption colour">
        <button type="button" data-color="white" class="active" style="--sw: #ffffff" aria-label="White caption">White</button>
        <button type="button" data-color="yellow" style="--sw: #ffd94d" aria-label="Yellow caption">Yellow</button>
        <button type="button" data-color="pink" style="--sw: #ff7ad9" aria-label="Pink caption">Pink</button>
      </div>
    </section>

    <section class="step" aria-label="Step 4: export">
      <h2><span class="step-no">4</span> Export</h2>
      <label class="select-label">Size
        <select id="size">
          <option value="1080x1080" selected>Square — 1080 × 1080</option>
          <option value="1080x1350">Portrait — 1080 × 1350</option>
          <option value="1920x1080">Wide — 1920 × 1080</option>
        </select>
      </label>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </section>

  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
    <p class="preview-note">Live preview — what you see is the PNG you get.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
